name: Deploy

on:
  push:
    branches: [main]
  # Pull requests run the test job only - the deploy job is gated on both the
  # branch and the event below, so a PR can never publish.
  pull_request:

jobs:
  # Replaces a former "build" job whose only step stamped a checkout that was
  # then discarded. The suite guards the things that have actually reached
  # production broken: embedded-blob drift, banned names and evidence-ledger
  # vocabulary in public copy, agent markup, and the version-stamping pipeline.
  # It deliberately does NOT run `npm run validate:evidence`, which needs the
  # gitignored .private/ ledger that CI does not have. No test reads .private/;
  # the ledger test uses an inline fixture.
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "24"

      - run: npm ci

      - run: npm test

  deploy:
    needs: test
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "24"

      - run: npm ci

      # No explicit stamp step: wrangler runs scripts/stamp-version.sh itself
      # via the build.command hook in wrangler.jsonc, so the stamp cannot be
      # skipped by invoking wrangler directly. The script fails the build if
      # the placeholder survives.
      - name: Deploy to Cloudflare Workers
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler deploy --compatibility-date 2025-09-27

      # Verifies what is actually serving, not what we believe we uploaded. A
      # deploy can report success while an unstamped build is live - that is
      # exactly the failure this step exists to catch, and it was silent
      # before. /api/version sits ahead of the traffic-quality gate so this
      # needs no User-Agent spoofing.
      - name: Verify deployed version
        run: |
          expected="$(git rev-parse --short HEAD)"
          echo "Expecting /api/version to report: ${expected}"
          for attempt in 1 2 3 4 5 6; do
            body="$(curl -fsS --max-time 15 https://guillermosalas.dev/api/version || true)"
            echo "attempt ${attempt}: ${body:-<no response>}"
            case "${body}" in
              *"${expected}"*)
                echo "Deployed version confirmed live."
                exit 0
                ;;
            esac
            sleep 10
          done
          echo "::error::/api/version never reported ${expected}; the deploy succeeded but the live build is stale or unstamped."
          exit 1

      - name: Show wrangler logs on failure
        if: failure()
        run: cat ~/.config/.wrangler/logs/*.log || echo "No logs found"
